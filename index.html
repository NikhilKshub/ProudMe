<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProudMe</title>
</head>

<body>
    <section id="onboarding">
        <h1>ProudMe</h1>
        <p>Make Yourself Proud</p>
        <form>
            <label for="why">Why do you want to do this?</label>
            <textarea id="why"></textarea>

            <label for="goals">What are your goals?(3-4 goals is good instead of heaving so many goal that will make you keep juggling between everything)</label>
            <textarea id="goals"></textarea>

            <label for="start-date">"When do you want to start? Or When did you start?"</label>
            <input type="date" id="start-date">

            <label for="end-date">"When do you want to end (I suggest 6 months)"</label>
            <input type="date" id="end-date">

            <button type="submit">Submit</button>
        </form>
    </section>
    
</body>
</html>
